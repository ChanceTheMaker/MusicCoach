<!doctype html><html><head><meta charset="utf-8"><title>Sample audio verification</title></head><body><h1>Local sample audio verification</h1><p>Decodes all bundled samples, then renders one note from each bank offline. No microphone or MIDI input is used.</p><button id="run">Run audio checks</button><pre id="result">Ready</pre><script type="module">
import {soundBanks} from '../sample-player.js';
document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#result');out.textContent='Checking…';document.querySelector('#run').disabled=true;try{let total=0,lines=[];for(const bank of Object.keys(soundBanks)){const res=await fetch('../assets/soundfonts/'+bank+'.json');if(!res.ok)throw Error(bank+' HTTP '+res.status);const raw=await res.json(),ctx=new OfflineAudioContext(2,44100,44100);let selected;for(const [pitch,b64] of Object.entries(raw.samples)){const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const decoded=await ctx.decodeAudioData(bytes.buffer);if(!Number.isFinite(decoded.duration)||decoded.duration<=0)throw Error(bank+' invalid sample '+pitch);if(Number(pitch)===60)selected=decoded;total++;}if(!selected)throw Error(bank+' missing C4');const source=ctx.createBufferSource();source.buffer=selected;source.connect(ctx.destination);source.start();const rendered=await ctx.startRendering(),samples=rendered.getChannelData(0);let sum=0,peak=0;for(const x of samples){if(!Number.isFinite(x))throw Error(bank+' nonfinite output');sum+=x*x;peak=Math.max(peak,Math.abs(x));}const rms=Math.sqrt(sum/samples.length);if(rms<.00001)throw Error(bank+' silent output');lines.push(bank+': decoded '+Object.keys(raw.samples).length+' notes; rendered RMS '+rms.toFixed(5)+' peak '+peak.toFixed(4));out.textContent=lines.join('\n');}out.textContent+='\nPASS: '+total+' samples decoded; all 8 instruments render non-silent audio.';}catch(e){out.textContent+='\nFAIL: '+e.message;}finally{document.querySelector('#run').disabled=false;}};
</script></body></html>
